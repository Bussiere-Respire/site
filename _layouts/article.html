---
layout: default
---
<section class="article-header">
  <div class="container">
    {% if page.category %}<span class="category">{{ page.category }}</span>{% endif %}
    <h1>{{ page.title }}</h1>
    {% if page.excerpt %}<p class="excerpt">{{ page.excerpt }}</p>{% endif %}
    {% if page.date %}<p class="article-date">{{ page.date | date: "%d/%m/%Y" }}</p>{% endif %}
  </div>
</section>
<section class="section section-light">
  <div class="container"><article class="article-content">{{ content }}</article></div>
</section>
