<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} — {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <meta name="description" content="{{ page.excerpt | default: site.description | strip_html | escape }}">
  <link rel="stylesheet" href="{{ '/style.css' | relative_url }}">
</head>
<body>
<header class="site-header">
  <div class="container nav">
    <a class="logo" href="{{ '/' | relative_url }}">Bussière Respire</a>
    <nav class="nav-links" aria-label="Navigation principale">
      <a href="{{ '/actualites/' | relative_url }}">Actualités</a>
      <a href="{{ '/comprendre/' | relative_url }}">Comprendre</a>
      <a href="{{ '/quartier/' | relative_url }}">Notre quartier</a>
      <a href="{{ '/agir/' | relative_url }}">Agir</a>
    </nav>
  </div>
</header>
<main>{{ content }}</main>
<footer class="site-footer">
  <div class="container">Bussière Respire · <a href="mailto:contact@bussiere-respire.fr">contact@bussiere-respire.fr</a></div>
</footer>
</body>
</html>
